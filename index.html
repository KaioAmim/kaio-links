<style>
:root{--bg:#0d0d0f;--purple:#5b21b6;--violet:#9266e0;--deep:#2e1065;--text:#f5f0ff;--muted:#a99cc4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(1100px 800px at 50% -10%,#1d1d21 0%,#111113 55%,#0a0a0b 100%) fixed,var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.b1{width:60vmax;height:60vmax;max-width:520px;max-height:520px;background:#2a1450;top:-12%;left:-18%;animation:f1 22s ease-in-out infinite}
.b2{width:50vmax;height:50vmax;max-width:460px;max-height:460px;background:#2a2a31;bottom:-10%;right:-16%;animation:f2 26s ease-in-out infinite}
.b3{width:34vmax;height:34vmax;max-width:320px;max-height:320px;background:#2b2b33;top:46%;left:52%;opacity:.5;animation:f3 30s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1);border-radius:50% 50% 50% 50%}33%{transform:translate(18vw,10vh) scale(1.15);border-radius:60% 40% 55% 45%}66%{transform:translate(6vw,26vh) scale(.92);border-radius:42% 58% 46% 54%}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-20vw,-14vh) scale(1.2);border-radius:58% 42% 40% 60%}75%{transform:translate(-6vw,-26vh) scale(.9);border-radius:45% 55% 60% 40%}}
@keyframes f3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-26vw,-18vh) scale(1.3)}}
main{position:relative;z-index:1;width:100%;max-width:440px;padding:56px 22px 36px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.avatar{position:relative;width:148px;height:148px;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,var(--purple),var(--violet),#1e0a45,var(--purple));animation:spin 8s linear infinite;box-shadow:0 0 48px rgba(91,33,182,.55)}
.avatar::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(146,102,224,.25)}
.avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid #0d0d0f;animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.intro{opacity:0;transform:translateY(14px);animation:rise .8s .1s cubic-bezier(.2,.8,.2,1) forwards;text-align:center}
h1{margin-top:26px;font-size:2rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.role{margin-top:8px;color:var(--violet);font-weight:700;font-size:1.02rem}
.links{margin-top:36px;width:100%;display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:20px;color:var(--violet);text-decoration:none;font-weight:700;font-size:1.05rem;background:rgba(26,26,29,.78);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transform:translateY(18px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease}
.btn:nth-child(1){animation-delay:.35s}.btn:nth-child(2){animation-delay:.48s}.btn:nth-child(3){animation-delay:.61s}.btn:nth-child(4){animation-delay:.74s}.btn:nth-child(5){animation-delay:.87s}.btn:nth-child(6){animation-delay:1s}
.btn svg{flex:none;width:24px;height:24px}
.btn .ico{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(91,33,182,.18);color:var(--violet);transition:background .25s,color .25s}
.btn span.t{flex:1}
.btn:hover,.btn:focus-visible{transform:translateY(-4px);border-color:rgba(146,102,224,.7);background:rgba(40,34,54,.85);box-shadow:0 14px 34px rgba(91,33,182,.4),0 0 0 1px rgba(146,102,224,.35)}
.btn:hover .ico,.btn:focus-visible .ico{background:var(--purple);color:#fff}
.btn:active{transform:translateY(-1px) scale(.99)}
.btn:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
@keyframes rise{to{opacity:1;transform:none}}
footer{margin-top:auto;padding-top:44px;color:var(--muted);font-size:.85rem;font-weight:500;opacity:0;animation:rise .7s 1.25s forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.blob{animation:none!important}.btn,.intro,footer{opacity:1;transform:none}}

canvas#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid{position:fixed;left:-50%;right:-50%;bottom:-6vh;height:50vh;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(91,33,182,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(91,33,182,.22) 1px,transparent 1px);background-size:56px 56px;transform:perspective(420px) rotateX(64deg);transform-origin:bottom;animation:gridmove 3s linear infinite;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 80%);mask-image:linear-gradient(to top,#000 5%,transparent 80%)}
@keyframes gridmove{to{background-position:0 56px}}
.scene{position:fixed;z-index:0;pointer-events:none;perspective:700px;transform:translate3d(calc(var(--mx,0)*30px),calc(var(--my,0)*30px),0)}
.cube{position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:cube var(--t,18s) linear infinite}
.cube i{position:absolute;inset:0;border:1.5px solid rgba(146,102,224,.6);background:rgba(255,255,255,.04);box-shadow:inset 0 0 18px rgba(91,33,182,.28)}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes cube{from{transform:rotateX(20deg) rotateY(0)}to{transform:rotateX(380deg) rotateY(360deg)}}
.ring{width:var(--s);height:var(--s);border-radius:50%;border:2px dashed rgba(146,102,224,.55);box-shadow:0 0 22px rgba(91,33,182,.4);transform-style:preserve-3d;animation:ring 12s linear infinite}
@keyframes ring{from{transform:rotateX(70deg) rotateZ(0)}to{transform:rotateX(70deg) rotateZ(360deg)}}
.sym{position:fixed;left:var(--x);top:var(--y);z-index:0;pointer-events:none;font:800 var(--s,28px) ui-monospace,Menlo,Consolas,monospace;color:rgba(146,102,224,.42);text-shadow:0 0 14px rgba(91,33,182,.8);animation:sym var(--d,9s) ease-in-out infinite}
@keyframes sym{0%,100%{transform:translateY(0) rotateY(0) rotate(-6deg)}50%{transform:translateY(-28px) rotateY(180deg) rotate(8deg)}}
.avatar-wrap{position:relative;transform:perspective(800px) rotateY(calc(var(--mx,0)*16deg)) rotateX(calc(var(--my,0)*-16deg));transition:transform .2s ease-out}
.spark{position:absolute;width:22px;height:22px;color:var(--violet);filter:drop-shadow(0 0 6px var(--purple));animation:tw 2.6s ease-in-out infinite}
.sp1{top:-6px;right:-14px}.sp2{bottom:12px;left:-26px;width:16px;height:16px;animation-delay:.8s}.sp3{top:34px;left:-34px;width:12px;height:12px;animation-delay:1.4s}.sp4{bottom:-8px;right:4px;width:14px;height:14px;animation-delay:2s}
@keyframes tw{0%,100%{transform:scale(.4) rotate(0);opacity:.3}50%{transform:scale(1.1) rotate(90deg);opacity:1}}
.scribble{display:block;margin:8px auto 0;width:170px;height:12px;overflow:visible}
.scribble path{stroke:var(--purple);stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.2s .8s ease forwards;filter:drop-shadow(0 0 5px var(--purple))}
@keyframes draw{to{stroke-dashoffset:0}}
.btn.ready{opacity:1;animation:none;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .15s ease-out,box-shadow .25s,border-color .25s,background .25s}
.btn.ready:hover,.btn.ready:focus-visible{--ty:-4px}
@media (prefers-reduced-motion:reduce){.grid,.cube,.ring,.sym,.spark{animation:none!important}.scribble path{stroke-dashoffset:0;animation:none}}

.coin{position:relative;width:148px;height:148px;transform-style:preserve-3d;transform:perspective(800px) rotateY(0deg);cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline:none}
.coin:active{cursor:grabbing}
.coin:focus-visible .avatar{outline:2px solid var(--violet);outline-offset:6px}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.coin-back{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#2c2c33,#111113);border:4px solid var(--purple);box-shadow:0 0 48px rgba(91,33,182,.6),inset 0 0 22px rgba(91,33,182,.45)}
.coin-back::before{content:"";position:absolute;inset:10px;border-radius:50%;border:1.5px dashed rgba(146,102,224,.55)}
.coin-back span{font-weight:800;font-size:2.7rem;letter-spacing:.02em;color:var(--violet);text-shadow:0 0 16px rgba(91,33,182,.9)}
.coin-back img{width:74%;height:auto;margin-top:2px;filter:drop-shadow(0 0 10px rgba(91,33,182,.75));pointer-events:none}

.pyr{position:relative;width:80px;height:88px;scale:var(--k,1);transform-style:preserve-3d;animation:pyr 16s linear infinite}
.pyr i{position:absolute;left:0;bottom:0;width:80px;height:96.7px;transform-origin:50% 100%;clip-path:polygon(50% 0,0 100%,100% 100%);background:linear-gradient(to top,rgba(146,102,224,.5),rgba(91,33,182,.14))}
.pyr i:nth-child(odd){background:linear-gradient(to top,rgba(91,33,182,.55),rgba(30,10,69,.2))}
.pyr i:nth-child(1){transform:translateZ(40px) rotateX(24.4deg)}
.pyr i:nth-child(2){transform:rotateY(90deg) translateZ(40px) rotateX(24.4deg)}
.pyr i:nth-child(3){transform:rotateY(180deg) translateZ(40px) rotateX(24.4deg)}
.pyr i:nth-child(4){transform:rotateY(270deg) translateZ(40px) rotateX(24.4deg)}
@keyframes pyr{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.coin-back img{transform:translateY(-7px)}
@media (prefers-reduced-motion:reduce){.pyr{animation:none!important}}
.btn.ready:hover,.btn.ready:focus-visible{color:#b99cf5}
</style>
</head>

<script>
document.getElementById('y').textContent=new Date().getFullYear();
(function(){
var rm=matchMedia('(prefers-reduced-motion:reduce)').matches,root=document.documentElement;
document.querySelectorAll('.btn').forEach(function(b){
  b.addEventListener('animationend',function(){b.classList.add('ready')},{once:true});
  if(rm)return;
  b.addEventListener('pointermove',function(e){var r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;b.style.setProperty('--ry',x*10+'deg');b.style.setProperty('--rx',-y*14+'deg')});
  b.addEventListener('pointerleave',function(){b.style.setProperty('--ry','0deg');b.style.setProperty('--rx','0deg')});
});
var coin=document.getElementById('coin'),rot=0,base=0,sx=0,lx=0,lt=0,vel=0,drag=false,moved=false;
function setR(a,an){coin.style.transition=an?'transform 1.2s cubic-bezier(.15,.7,.2,1)':'none';coin.style.transform='perspective(800px) rotateY('+a+'deg)'}
function flip(){rot=Math.round(rot/180)*180+720;setR(rot,true)}
coin.addEventListener('pointerdown',function(e){drag=true;moved=false;sx=lx=e.clientX;lt=performance.now();vel=0;base=rot;coin.setPointerCapture(e.pointerId)});
coin.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-sx;if(Math.abs(dx)>5)moved=true;if(moved){var n=performance.now();vel=(e.clientX-lx)/(n-lt+1);lx=e.clientX;lt=n;setR(base+dx*1.4,false)}});
function up(e){if(!drag)return;drag=false;if(!moved){rot=base;flip();return}rot=Math.round((base+(e.clientX-sx)*1.4+vel*260)/180)*180;setR(rot,true)}
coin.addEventListener('pointerup',up);coin.addEventListener('pointercancel',function(){if(!drag)return;drag=false;rot=Math.round(rot/180)*180;setR(rot,true)});
coin.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
if(rm)return;
addEventListener('pointermove',function(e){root.style.setProperty('--mx',(e.clientX/innerWidth-.5)*2);root.style.setProperty('--my',(e.clientY/innerHeight-.5)*2)});
var c=document.getElementById('fx'),x=c.getContext('2d'),w,h,p=[],n;
function rs(){var d=devicePixelRatio||1;w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);n=Math.min(60,Math.floor(w*h/16000));p=[];for(var i=0;i<n;i++)p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6})}
function f(){x.clearRect(0,0,w,h);for(var i=0;i<n;i++){var a=p[i];a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1;x.fillStyle='rgba(170,130,240,.75)';x.beginPath();x.arc(a.x,a.y,a.r,0,6.3);x.fill();
for(var j=i+1;j<n;j++){var b=p[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<14000){x.strokeStyle='rgba(91,33,182,'+(.35*(1-d/14000))+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}requestAnimationFrame(f)}
rs();addEventListener('resize',rs);f();
})();
